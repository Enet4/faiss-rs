[package]
name = "faiss"
description = "High-level bindings for Faiss, the vector similarity search engine"
version = "0.13.0"
authors = ["Eduardo Pinho <enet4mikeenet@gmail.com>"]
license = "MIT/Apache-2.0"
repository = "https://github.com/Enet4/faiss-rs"
categories = ["algorithms", "science"]
keywords = ["cbir", "clustering", "index", "similarity"]
readme = "README.md"
edition = "2018"

[features]
gpu = ["faiss-sys/gpu"]
static = ["faiss-sys/static"]

[badges.maintenance]
status = "passively-maintained"

[dependencies.faiss-sys]
version = "0.7.0"
path = "faiss-sys"

[dev-dependencies]
criterion = "0.7.0"
rand = "0.9.2"

[package.metadata.docs.rs]
features = ["gpu"]

[[bench]]
name = "search_index_ivf_flat"
harness = false
